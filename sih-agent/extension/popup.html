<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SIH Privacy Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 0;

            width: 470px;

            min-height: 600px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffffff;

            color: #111111;
        }


        .header {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 14px 18px;

            font-size: 21px;

            font-weight: 700;

            border-bottom: 1px solid #dddddd;
        }


        .status {

            margin: 14px 18px;

            padding: 15px;

            border: 1px solid #10b981;

            border-radius: 12px;

            background: #ecfdf5;

            color: #065f46;

            font-weight: 600;

            font-size: 15px;
        }


        .capture-button {

            display: block;

            width: calc(100% - 36px);

            margin: 18px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background: #223f67;

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        .capture-button:hover {

            background: #1a3150;
        }


        .capture-button:active {

            transform: scale(0.99);
        }


        .capture-button:disabled {

            background: #8a99aa;

            cursor: wait;
        }


        .result {

            margin: 0 18px 18px 18px;

            font-size: 16px;

            line-height: 1.5;
        }


        .result-title {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 14px;
        }


        .row {

            margin: 4px 0;
        }


        .label {

            font-weight: 700;
        }


        .success {

            color: #087f3e;

            font-weight: 600;
        }


        .error {

            color: #b91c1c;

            font-weight: 600;
        }


        .preview {

            width: 100%;

            max-height: 500px;

            object-fit: contain;

            border: 1px solid #cccccc;

            border-radius: 8px;

            margin-top: 14px;

            background: #f3f4f6;
        }


        .small {

            font-size: 12px;

            color: #666666;

            margin-top: 8px;
        }


        .hidden {

            display: none;
        }


        .loading {

            display: inline-block;

            width: 14px;

            height: 14px;

            border: 2px solid rgba(255,255,255,0.4);

            border-top-color: white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            vertical-align: -2px;

            margin-right: 7px;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

    </style>

</head>


<body>


    <div class="header">

        🔒 SIH Privacy Agent

    </div>


    <div class="status">

        • Local Privacy Engine Active

    </div>


    <button
        id="captureButton"
        class="capture-button">

        🛡️ Capture &amp; Sanitize Screen

    </button>


    <div
        id="result"
        class="result hidden">

        <div
            id="resultTitle"
            class="result-title">
        </div>

        <div id="resultContent"></div>

    </div>


    <script src="popup.js"></script>

</body>

</html>
