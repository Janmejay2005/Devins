<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>SIH Privacy Agent</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            padding: 0;

            width: 470px;

            min-height: 600px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #ffffff;

            color: #111111;
        }


        /* =====================================================
           HEADER
           ===================================================== */

        .header {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 14px 18px;

            font-size: 21px;

            font-weight: 700;

            border-bottom: 1px solid #dddddd;
        }


        /* =====================================================
           PRIVACY STATUS
           ===================================================== */

        .status {

            margin: 14px 18px;

            padding: 15px;

            border: 1px solid #10b981;

            border-radius: 12px;

            background: #ecfdf5;

            color: #065f46;

            font-weight: 600;

            font-size: 15px;
        }


        /* =====================================================
           TASK SECTION
           ===================================================== */

        .task-section {

            margin: 0 18px 14px 18px;
        }


        .task-label {

            display: block;

            margin-bottom: 7px;

            font-size: 15px;

            font-weight: 700;
        }


        .task-input {

            width: 100%;

            min-height: 78px;

            padding: 12px;

            resize: vertical;

            border: 1px solid #cbd5e1;

            border-radius: 10px;

            outline: none;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 14px;

            line-height: 1.45;

            color: #111111;

            background: #ffffff;
        }


        .task-input:focus {

            border-color: #223f67;

            box-shadow:
                0 0 0 2px
                rgba(34, 63, 103, 0.10);
        }


        .task-help {

            margin-top: 6px;

            font-size: 12px;

            color: #666666;

            line-height: 1.4;
        }


        /* =====================================================
           QUICK TASKS
           ===================================================== */

        .quick-tasks {

            display: flex;

            flex-wrap: wrap;

            gap: 7px;

            margin-top: 10px;
        }


        .quick-task {

            padding: 7px 10px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            background: #f8fafc;

            color: #334155;

            font-size: 12px;

            cursor: pointer;
        }


        .quick-task:hover {

            background: #eef2f7;
        }


        /* =====================================================
           EXECUTE BUTTON
           ===================================================== */

        .capture-button {

            display: block;

            width: calc(100% - 36px);

            margin: 18px;

            padding: 16px;

            border: none;

            border-radius: 12px;

            background: #223f67;

            color: white;

            font-size: 17px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s,
                transform 0.1s;
        }


        .capture-button:hover {

            background: #1a3150;
        }


        .capture-button:active {

            transform: scale(0.99);
        }


        .capture-button:disabled {

            background: #8a99aa;

            cursor: wait;
        }


        /* =====================================================
           RESULT
           ===================================================== */

        .result {

            margin:
                0
                18px
                18px
                18px;

            font-size: 15px;

            line-height: 1.5;
        }


        .result-title {

            font-size: 17px;

            font-weight: 700;

            margin-bottom: 14px;
        }


        .row {

            margin: 6px 0;
        }


        .label {

            font-weight: 700;
        }


        .success {

            color: #087f3e;

            font-weight: 600;
        }


        .error {

            color: #b91c1c;

            font-weight: 600;
        }


        .privacy-badge {

            display: inline-block;

            margin-top: 4px;

            padding: 4px 8px;

            border-radius: 6px;

            background: #ecfdf5;

            color: #065f46;

            font-size: 12px;

            font-weight: 700;
        }


        /* =====================================================
           IMAGE PREVIEW
           ===================================================== */

        .preview {

            display: block;

            width: 100%;

            max-height: 500px;

            object-fit: contain;

            border: 1px solid #cccccc;

            border-radius: 8px;

            margin-top: 14px;

            background: #f3f4f6;
        }


        /* =====================================================
           SMALL TEXT
           ===================================================== */

        .small {

            font-size: 12px;

            color: #666666;

            margin-top: 8px;

            line-height: 1.4;
        }


        .hidden {

            display: none;
        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading {

            display: inline-block;

            width: 14px;

            height: 14px;

            border: 2px solid rgba(255,255,255,0.4);

            border-top-color: white;

            border-radius: 50%;

            animation:
                spin 0.8s linear infinite;

            vertical-align: -2px;

            margin-right: 7px;
        }


        @keyframes spin {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <div class="header">

        🔒 SIH Privacy Agent

    </div>


    <!-- =====================================================
         PRIVACY STATUS
         ===================================================== -->

    <div class="status">

        🟢 Local Privacy Engine Active

        <div class="small">

            Sensitive information is detected and
            sanitized locally before AI processing.

        </div>

    </div>


    <!-- =====================================================
         TASK
         ===================================================== -->

    <div class="task-section">

        <label
            class="task-label"
            for="taskInput">

            🤖 Agent Task

        </label>


        <textarea
            id="taskInput"
            class="task-input"
            placeholder="Example: Click the Full Name field"
            spellcheck="false"></textarea>


        <div class="task-help">

            Tell the agent what browser action to perform.
            Sensitive values are never reconstructed from
            redacted content.

        </div>


        <div class="quick-tasks">

            <button
                type="button"
                class="quick-task"
                data-task="Click the Full Name field">

                Full Name

            </button>


            <button
                type="button"
                class="quick-task"
                data-task="Click the Email field">

                Email

            </button>


            <button
                type="button"
                class="quick-task"
                data-task="Click the Phone field">

                Phone

            </button>


            <button
                type="button"
                class="quick-task"
                data-task="Click Submit">

                Submit

            </button>


            <button
                type="button"
                class="quick-task"
                data-task="Scroll down">

                Scroll Down

            </button>

        </div>

    </div>


    <!-- =====================================================
         EXECUTE
         ===================================================== -->

    <button
        id="captureButton"
        class="capture-button">

        🛡️ Execute Private Agent

    </button>


    <!-- =====================================================
         RESULT
         ===================================================== -->

    <div
        id="result"
        class="result hidden">

        <div
            id="resultTitle"
            class="result-title">
        </div>

        <div id="resultContent"></div>

    </div>


   <script defer src="popup.js"></script>

</body>

</html>
